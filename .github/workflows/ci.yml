name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install "pip<24.1" && pip install -e .
      - name: Compile Python sources
        run: python -m compileall -q quant backend
      - name: Run Python tests
        run: python -m unittest discover -s tests -p "test_*.py"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test -- --run
      - name: Build frontend
        run: npm run build

  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked secrets and generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(git ls-files | grep -E '(^|/)(\.env$|node_modules/|dist/|mlruns/|tmp/|[^/]+\.egg-info/|\.DS_Store$)' || true)"
          if [ -n "$forbidden" ]; then
            echo "Forbidden tracked files:"
            echo "$forbidden"
            exit 1
          fi
